# Netlify serves this whole repo as patron.kolilink.com (it replaces GitHub Pages). Only /pay/* and /p/* run code
# (netlify/functions/p.mjs); everything else is the same static files as before.
[build]
  publish = "."
  command = "echo no build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@resvg/resvg-js"]

# Universal links / app links: the same files GitHub Pages served, with an explicit JSON type.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
