# Netlify serves this repo at pay.patron.kolilink.com ONLY. patron.kolilink.com stays on GitHub Pages.
# Only /pay/* and /p/* run code (netlify/functions/p.mjs); the rest is just static files (unused on this host).
[build]
  publish = "."
  command = "echo no build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@resvg/resvg-js"]

# Harmless on this host; kept so the files are served right if the whole site ever moves here.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
