name: Vérifications du site

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  invite-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Textes de la page d'invitation
        run: node scripts/check-invite-page.mjs

  payment-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Page de paiement, aperçu WhatsApp, carte image
        run: |
          cd worker/payment-link && npm i --omit=dev
          cd ../.. && node scripts/check-payment-link.mjs
