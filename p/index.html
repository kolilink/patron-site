<script>
/* VITESSE : on lance la demande des chiffres tout de suite, sans attendre que pay.js soit téléchargé.
   pay.js reprend cette demande (window.__pay) au lieu d'en refaire une. Même règle de jeton que pay.js.
   SÉCURITÉ : le jeton est lu après « # » (ou dans un ancien ?t=) et part dans le CORPS d'un POST, jamais dans une adresse. */
(function () {
  var h = new URLSearchParams(location.hash.replace(/^#/, '')), q = new URLSearchParams(location.search);
  var t = h.get('t') || q.get('t') || '';
  if (/^[A-Za-z0-9_-]{22}$/.test(t)) window.__pay = { t: t, p: fetch('https://jnxpujsyvbenqgjbvifh.supabase.co/functions/v1/payment-page', { method: 'POST', headers: { 'content-type': 'text/plain' }, body: t, referrerPolicy: 'no-referrer', cache: 'no-store' }).catch(function () { return null; }) };
})();
</script>
