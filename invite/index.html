<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

    <title>On t'invite sur Patron</title>
    <meta name="description" content="Note chaque vente et chaque personne qui te doit même sans internet" />

    <!-- Open Graph / Twitter — the WhatsApp preview card. Static on purpose:
       this page is served by static GitHub Pages, so og:title is the generic
       invitation title (the inviter's name is rendered client-side for humans,
       not for crawlers — WhatsApp's crawler does not run JS). -->
    <meta property="og:title" content="On t'invite sur Patron" />
    <meta property="og:description" content="Note chaque vente et chaque personne qui te doit même sans internet" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://patron.kolilink.com/invite" />
    <meta property="og:image" content="https://patron.kolilink.com/invite/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
        :root {
            --purple: #6366F1;
            --purple-dark: #4F46E5;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, var(--purple) 0%, var(--purple-dark) 100%);
            color: #fff;
            /* La page ne bouge jamais : coquille fixée à l'écran (aucun
               défilement, aucun rebond), hauteur en dvh pour suivre la
               barre d'outils Safari sans saut. */
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* Le bloc est centré dans l'espace restant au-dessus d'un grand
               padding bas : le centre optique (là où l'œil lit « centré »)
               est au-dessus du centre géométrique, et la barre d'adresse
               iOS mange le bas de l'écran. Le centre du bloc tombe ainsi
               vers ~40 % de la hauteur visible, le titre dans le tiers haut. */
            padding: 24px 24px 14vh;
        }

        .card {
            max-width: 420px;
            width: 100%;
            transform: translateY(-28px);
        }

        h1 {
            /* Une seule ligne, quoi qu'il arrive : pas de retour à la
               ligne, taille liée à l'écran, et le script réduit encore
               si le nom est long. Aucun point en fin de phrase. */
            font-size: clamp(18px, 6.1vw, 26px);
            white-space: nowrap;
            line-height: 1.25;
            margin: 0 0 12px;
            font-weight: 700;
            /* La place de la ligne est réservée dès le départ et le
               titre n'apparaît qu'une fois le nom résolu (fondu) :
               l'arrivée du nom ne déplace rien. */
            min-height: 1.25em;
            opacity: 0;
            transition: opacity .18s ease;
        }

        h1.ready {
            opacity: 1;
        }

        p.tagline {
            font-size: 16px;
            line-height: 1.5;
            margin: 0 0 26px;
            opacity: .92;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            margin-bottom: 12px;
            font-family: inherit;
        }

        .btn-primary {
            background: #fff;
            color: var(--purple-dark);
        }

        .btn-primary:active {
            opacity: .85;
        }



        .btn-play {
            background: #fff;
            color: #202124;
        }

        .btn-play:active {
            opacity: .85;
        }



        .foot {
            margin-top: 8px;
            font-size: 13px;
            opacity: .75;
        }

        /* La preuve, en bas : elle s'installe en fondu, sans jamais
           voyager. Le nombre est vérifié à chaque publication du site
           (commerces réels, comptes de test exclus) et épinglé par la
           garde. */
        .proof {
            font-variant-numeric: tabular-nums;
            margin-top: 14px;
            font-size: 13.5px;
            opacity: 0;
            animation: proof-in .6s ease 1s forwards;
        }

        .proof strong {
            font-weight: 700;
        }

        @keyframes proof-in {
            to {
                opacity: .88;
            }
        }

        /* Les seuls chiffres en vert (le vert « Réglé » de l'app) ;
           ils roulent sur place, dans leur fenêtre — la ligne et la
           position du nombre ne bougent jamais. */
        .proof .num {
            color: #8CF0B3;
        }

        .reel {
            display: inline-block;
            height: 1em;
            overflow: hidden;
            position: relative;
            top: .13em;
        }

        .strip {
            display: flex;
            flex-direction: column;
            transition: transform .95s cubic-bezier(.22, .8, .24, 1);
        }

        .strip span {
            display: block;
            height: 1em;
            line-height: 1;
            text-align: center;
        }

        /* Les boutons sont ordonnés (le magasin de SON téléphone en
           premier) avant d'apparaître : jamais le mauvais ordre. */
        #stores {
            opacity: 0;
        }

        #stores.ready {
            opacity: 1;
            transition: opacity .18s ease;
        }

        @media (prefers-reduced-motion: reduce) {
            .proof {
                animation: none;
                opacity: .88;
            }

            #stores.ready {
                transition: none;
            }
        }

    </style>
</head>

<body>
    <div class="card">
        <h1 id="title">On t'invite sur Patron</h1>
        <p class="tagline">Note chaque vente et chaque personne qui te doit même sans internet</p>

        <div id="stores">
            <a class="btn btn-primary" id="store-ios" href="https://apps.apple.com/us/app/patron/id6772757310"
                target="_blank" rel="noopener">Télécharger sur l'App Store</a>

            <a class="btn btn-play" id="store-play"
                href="https://play.google.com/store/apps/details?id=com.awall.patron" target="_blank" rel="noopener">
                Télécharger sur Play Store
            </a>
        </div>
        <script>
            // L'ordre des magasins suit le téléphone de la visiteuse,
            // décidé avant que les boutons n'apparaissent. Les deux
            // boutons restent toujours là, pleine taille : la détection
            // ne choisit que l'ordre. Un « Macintosh » tactile = un iPad.
            (function () {
                var ua = navigator.userAgent || '';
                var w = document.getElementById('stores');
                if (!w) return;
                var isIOS = /iPhone|iPad|iPod/i.test(ua)
                    || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 0);
                if (isIOS) {
                    w.insertBefore(document.getElementById('store-ios'), document.getElementById('store-play'));
                }
                w.classList.add('ready');
            })();
        </script>

        <div class="proof"><strong><span id="shop-count" class="num">130</span> commerces</strong> déjà sur Patron</div>

        <div class="foot">Gratuit et fait pour les vendeurs</div>
    </div>

    <script>
        (function () {
            'use strict';

            // Public values, same as the app client.
            var SUPABASE_URL = 'https://jnxpujsyvbenqgjbvifh.supabase.co';
            var ANON_KEY = 'sb_publishable_z2cta2M53RtwpGoWUV6LMQ_LoUkSjaD';
            var PLAY_STORE_BASE = 'https://play.google.com/store/apps/details?id=com.awall.patron';
            var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

            // The inviter id comes from /invite/<id> (404.html forwards that
            // path here as ?i=<id>). Anything that is not a uuid is ignored.
            function inviterId() {
                try {
                    var q = new URLSearchParams(window.location.search).get('i') || '';
                    var m = window.location.pathname.replace(/\/+$/, '').match(/^\/invite\/([^\/]+)$/);
                    var id = (q || (m ? m[1] : '')).trim();
                    return UUID_RE.test(id) ? id.toLowerCase() : '';
                } catch (e) {
                    return '';
                }
            }

            var id = inviterId();

            var titleEl = document.getElementById('title');
            var storePlay = document.getElementById('store-play');

            // Attribution: the Play install referrer carries the inviter id.
            // (iOS cold installs are unattributed by design.)
            if (id) {
                storePlay.href = PLAY_STORE_BASE + '&referrer=' + encodeURIComponent('patron_invite=' + id);
            }

            function fitTitle() {
                // Une seule ligne quoi qu'il arrive : on repart de la
                // taille CSS, puis on réduit jusqu'à ce que ça tienne.
                var size = 26;
                titleEl.style.fontSize = '';
                while (titleEl.scrollWidth > titleEl.clientWidth && size > 14) {
                    size -= 1;
                    titleEl.style.fontSize = size + 'px';
                }
            }

            function setTitle(name) {
                var t = name ? name + ' t\u2019invite sur Patron' : "On t'invite sur Patron";
                titleEl.textContent = t;
                document.title = t;
                fitTitle();
                titleEl.classList.add('ready');
            }

            // Inviter name (anon RPC). Any failure → the generic headline.
            if (!id) {
                setTitle('');
            }
            // Filet : si le RPC traîne, le titre générique se révèle quand
            // même (l'espace de deux lignes est réservé, rien ne bouge).
            setTimeout(function () { titleEl.classList.add('ready'); }, 900);
            if (id) {
                fetch(SUPABASE_URL + '/rest/v1/rpc/preview_inviter', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': ANON_KEY,
                        'Authorization': 'Bearer ' + ANON_KEY
                    },
                    body: JSON.stringify({ p_inviter_id: id })
                })
                    .then(function (res) { return res.ok ? res.json() : null; })
                    .then(function (data) {
                        var name = data && data.valid && data.inviter_name ? String(data.inviter_name).trim() : '';
                        setTitle(name);
                    })
                    .catch(function () { setTitle(''); });
            }
        })();
    </script>
    <script>
        // Le rouleau des chiffres : chaque chiffre défile dans sa
        // fenêtre et s'arrête sur le nombre vrai. Sans JavaScript ou
        // en mouvement réduit, le nombre reste écrit, immobile.
        (function () {
            'use strict';
            var el = document.getElementById('shop-count');
            if (!el) return;
            var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduce) return;
            var digits = el.textContent.trim().split('');
            el.textContent = '';
            digits.forEach(function (d, i) {
                var reel = document.createElement('span');
                reel.className = 'reel';
                var strip = document.createElement('span');
                strip.className = 'strip';
                for (var n = 0; n <= 9; n++) {
                    var c = document.createElement('span');
                    c.textContent = n;
                    strip.appendChild(c);
                }
                var last = document.createElement('span');
                last.textContent = d;
                strip.appendChild(last);
                reel.appendChild(strip);
                el.appendChild(reel);
                setTimeout(function () { strip.style.transform = 'translateY(-10em)'; }, 1000 + i * 70);
            });
        })();
    </script>
</body>

</html>
